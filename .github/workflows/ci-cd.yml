name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Build and Lint the Client (Vite/React)
  client-ci:
    name: Client CI (React/Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Run Client Linter
        run: |
          cd client
          npm run lint

      - name: Verify Client Build
        run: |
          cd client
          npm run build

  # Job 2: Install and Validate Server (Node/Express)
  server-ci:
    name: Server CI (Node/Express)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      # Optional: Uncomment when tests are added to the server
      # - name: Run Server Tests
      #   run: |
      #     cd server
      #     npm test

  # Job 3: Deployment Trigger (Only runs on push/merge to main after CI passes)
  deploy:
    name: Deploy to Render
    needs: [client-ci, server-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Webhook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_URL secret is not set in GitHub. Please configure it in your Repository Settings."
            exit 1
          fi
          echo "Triggering Render deploy..."
          curl -s -S -X POST "$RENDER_DEPLOY_HOOK"
          echo "Deployment trigger sent successfully."
